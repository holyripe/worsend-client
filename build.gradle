plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add any third-party mod repositories here if you depend on other mods.
    maven { url 'https://maven.fabricmc.net/' }
}

loom {
    // Standard Fabric Loom setup — nothing custom needed for a client-only mod.
}

dependencies {
    // Minecraft + mappings + loader, versions pulled from gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API — required for ClientTickEvents, WorldRenderEvents, HudRenderCallback used throughout this mod
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // fastutil is already shipped inside Minecraft itself; declared here explicitly
    // so CombatTracker's Int2LongOpenHashMap resolves cleanly in the IDE.
    modImplementation "it.unimi.dsi:fastutil:8.5.9"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId project.archives_base_name
            from components.java
        }
    }
    repositories {
        // Add your own maven repo here if you publish builds somewhere.
    }
}
